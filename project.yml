name: PragueStreetTracker
options:
  bundleIdPrefix: com.krystofskala
  deploymentTarget:
    iOS: "16.0"

packages:
  StreetTrackerCore:
    path: Packages/StreetTrackerCore

targets:
  PragueStreetTracker:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: StreetTrackerCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Prague Streets"
        CFBundleDevelopmentRegion: cs
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Appka zaznamenává, kterými ulicemi jsi prošel. Poloha zůstává jen v tomto telefonu a nikam se neposílá."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Poloha na pozadí je potřeba, aby appka sledovala chůzi i se zamčeným telefonem. Zůstává jen v tomto telefonu a nikam se neposílá."
        NSMotionUsageDescription: "Pohyb slouží k rozlišení chůze od jízdy autem nebo na kole, aby se jízda nezapočítala."
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krystofskala.praguestreettracker
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
