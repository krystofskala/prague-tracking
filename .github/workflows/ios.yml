# Appka pro iPhone bez Macu: macOS runner postaví NEPODEPSANÝ .ipa,
# podepíše ho až SideStore v telefonu (bezplatné Apple ID). Stejný postup
# jako iOS build Opentify.
#
# Spuštění: tag `ios-*` / `app-*` nebo ručně (Actions › iOS build › Run).
# Výsledek: GitHub Release s PragueStreetTracker.ipa a nový source.json ve
# větvi `altstore` -- SideStore update nabídne sám. Každé spuštění = nová
# verze pro telefon, proto jen na Kryštofův pokyn.
name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ['ios-*', 'app-*']

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build pro iPhone (bez podpisu)
        run: >
          xcodebuild build
          -project PragueStreetTracker.xcodeproj
          -scheme PragueStreetTracker
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          MARKETING_VERSION=0.1.${{ github.run_number }}
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Zabalit .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/PragueStreetTracker.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          codesign --force --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PragueStreetTracker.ipa Payload
          ls -lh PragueStreetTracker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PragueStreetTracker-ipa
          path: PragueStreetTracker.ipa
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}
          files: PragueStreetTracker.ipa
          prerelease: true
          body: |
            Nepodepsaná appka pro iPhone (verze 0.1.${{ github.run_number }}). Aktualizace chodí samy přes zdroj
            v SideStore: https://raw.githubusercontent.com/${{ github.repository }}/altstore/source.json

      - name: Zdroj pro SideStore (source.json)
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/PragueStreetTracker.ipa"
          SIZE=$(stat -f%z PragueStreetTracker.ipa)
          python3 .github/scripts/altstore_source.py "0.1.${{ github.run_number }}" "$URL" "$SIZE" /tmp/source.json "${{ github.sha }}"
          git config user.name "prague-tracking-ci"
          git config user.email "prague-tracking-ci@users.noreply.github.com"
          git fetch origin altstore || true
          if git rev-parse --verify origin/altstore >/dev/null 2>&1; then
            git checkout -f -B altstore origin/altstore
          else
            git checkout --orphan altstore
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/source.json source.json
          git add source.json
          git commit -m "Prague Streets 0.1.${{ github.run_number }}" || echo "beze změny"
          git push origin altstore
